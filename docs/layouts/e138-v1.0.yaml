version: "1.0"
delimiter: tab
encoding: ascii

rowTypes:

  header:
    role: header
    rows: 1
    skip: true

  footer:
    role: trailer
    rows: 1
    skip: true
    match: { index: 0, value: Footer }   # ACI footer row carries "Footer" in its Type column

  data:
    role: data
    fields:
      - { name: OutstandingAuthorisationId,                  index: 0 }
      - { name: CardExternalID,                              index: 1,  encrypt: true }
      - { name: RetrievalReferenceNumber,                    index: 2 }
      - { name: AuthorisationDate,                           index: 3 }
      - { name: AuthorisationTime,                           index: 4 }
      - { name: StatusCode,                                  index: 5 }
      - { name: DeleteStatusFlag,                            index: 6 }
      - { name: AdditionalSettlementMatchingCriteria,        index: 7 }
      - { name: NetworkType,                                 index: 8 }
      - { name: ProcessorTranCode,                           index: 9 }
      - { name: MerchantCategoryCode,                        index: 10 }
      - { name: OriginalTransactionAmount,                   index: 11 }
      - { name: TransactionAmount,                           index: 12, required: true }
      - { name: ApprovalCode,                                index: 13 }
      - { name: ActionCode,                                  index: 14 }
      - { name: ProcessingCode,                              index: 15 }
      - { name: MessageType,                                 index: 16 }
      - { name: ReversalMessageType,                         index: 17 }
      - { name: LastUpdateDateAndTime,                       index: 18, required: true }
      - { name: BIN,                                         index: 19, required: true }
      - { name: ACIProductID,                                index: 20, required: true }
      - { name: TransactionDescription,                      index: 21 }
      - { name: CashBackAmount,                              index: 22, required: true }
      - { name: POSEntryData,                                index: 23 }
      - { name: TerminalID,                                  index: 24 }
      - { name: UNUSED-25,                                   index: 25, skip: true }
      - { name: UNUSED-26,                                   index: 26, skip: true }
      - { name: MerchantID,                                  index: 27 }
      - { name: AddressValidationResponse,                   index: 28 }
      - { name: ATCValidationResult,                         index: 29 }
      - { name: STIPReason,                                  index: 30 }
      - { name: UNUSED-31,                                   index: 31, skip: true }
      - { name: CardHolderVerificationMethod,                index: 32 }
      - { name: TerminalVerificationResult,                  index: 33 }
      - { name: AuthRiskScore,                               index: 34 }
      - { name: UNUSED-35,                                   index: 35, skip: true }
      - { name: CVV1VerificationResult,                      index: 36, encrypt: true }
      - { name: CVV2VerificationResult,                      index: 37, encrypt: true }
      - { name: UNUSED-38,                                   index: 38, skip: true }
      - { name: UNUSED-39,                                   index: 39, skip: true }
      - { name: ECIValue,                                    index: 40 }
      - { name: PreAuthIndicator,                            index: 41 }
      - { name: UNUSED-42,                                   index: 42, skip: true }
      - { name: UNUSED-43,                                   index: 43, skip: true }
      - { name: UNUSED-44,                                   index: 44, skip: true }
      - { name: UNUSED-45,                                   index: 45, skip: true }
      - { name: ACIAccountExternalID,                        index: 46, encrypt: true }
      - { name: AcquirerCountryCode,                         index: 47 }
      - { name: LocalTransactionAmountCurrencyCode,          index: 48 }
      - { name: UNUSED-49,                                   index: 49, skip: true }
      - { name: PinPVVCheckResult,                           index: 50, encrypt: true }
      - { name: CurrencyCode,                                index: 51 }
      - { name: CashbackCheckResultCode,                     index: 52 }
      - { name: AuthFeeAmount,                               index: 53 }
      - { name: UNUSED-54,                                   index: 54, skip: true }
      - { name: UnrecognisedCardholderVerificationMethodCode, index: 55 }
      - { name: CardNotPresentTransactionTypeCode,           index: 56 }
      - { name: ReversalDate,                                index: 57 }
      - { name: ReversalTime,                                index: 58 }
      - { name: MaxPreAuthRetentionDays,                     index: 59 }
